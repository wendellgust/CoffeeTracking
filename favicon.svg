<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="cupGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>
    <linearGradient id="steamGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#fcd34d" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#fef3c7" stop-opacity="0.1" />
    </linearGradient>
    <linearGradient id="saucerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350f" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Dark circular background badge for high contrast in light & dark browser tabs -->
  <circle cx="32" cy="32" r="30" fill="#1b130e" stroke="#f59e0b" stroke-width="2.5" />

  <g filter="url(#glow)">
    <!-- Steam waves -->
    <path d="M24 20 C22 15, 26 12, 24 7" fill="none" stroke="url(#steamGrad)" stroke-width="2.5" stroke-linecap="round" />
    <path d="M32 19 C30 13, 34 10, 32 5" fill="none" stroke="url(#steamGrad)" stroke-width="3" stroke-linecap="round" />
    <path d="M40 20 C38 15, 42 12, 40 7" fill="none" stroke="url(#steamGrad)" stroke-width="2.5" stroke-linecap="round" />

    <!-- Saucer / Base -->
    <ellipse cx="32" cy="49" rx="18" ry="4" fill="url(#saucerGrad)" stroke="#f59e0b" stroke-width="1.5" />

    <!-- Cup Handle -->
    <path d="M38 27 C49 27, 49 41, 38 41" fill="none" stroke="url(#cupGrad)" stroke-width="4.5" stroke-linecap="round" />

    <!-- Cup Body -->
    <path d="M18 24 L46 24 C45 37, 40 45, 32 45 C24 45, 19 37, 18 24 Z" fill="url(#cupGrad)" stroke="#fbbf24" stroke-width="1.5" />

    <!-- Coffee Surface / Crema Inside Rim -->
    <ellipse cx="32" cy="24" rx="14" ry="3.5" fill="#451a03" stroke="#fcd34d" stroke-width="1.2" />
    <ellipse cx="32" cy="24" rx="10" ry="2" fill="#78350f" />
    
    <!-- Heart / Crema Art on coffee surface -->
    <path d="M30.5 23.5 C30.5 22.5, 31.5 22.5, 32 23.5 C32.5 22.5, 33.5 22.5, 33.5 23.5 C33.5 24.3, 32 25, 32 25 C32 25, 30.5 24.3, 30.5 23.5 Z" fill="#fbbf24" />
  </g>
</svg>
